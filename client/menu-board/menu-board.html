<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Board</title>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="menu-board.css">
</head>
<body>
    <table class="table table-bordered">
        <thead class="heading">
            <tr>
                <th rowspan="2">Blogging App</th>
            </tr>
        </thead>
        <tbody class="tbody">
            <tr>
                <td>My Blogs</td>
                <td rowspan="7" class="details-part"></td>
            </tr>
            <tr>
                <td class="menu-option">All Blogs</td>
            </tr>
            <tr>
                <td class="menu-option">Add Category</td>
            </tr>
            <tr>
                <td class="menu-option">Show Categories</td>
            </tr>
            <tr>
                <td class="menu-option">Add Blog</td>
            </tr>
            <tr>
                <td class="menu-option">Search Blogs</td>
            </tr>
            <tr>
                <td class="menu-option">Logout</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
